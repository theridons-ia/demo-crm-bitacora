<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitácora Campo · Supervisor</title>
  <meta name="theme-color" content="#F7F3ED">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" style="max-width:720px; padding-bottom:28px">
    <main class="screen active" style="display:block">
      <div class="title-row">
        <div>
          <p class="eyebrow">SUPERVISOR</p>
          <h1 class="screen-title">Panel del equipo</h1>
          <p class="sub">Monitorea rutas, efectividad y cobranza.</p>
        </div>
        <a class="icon-btn" href="./index.html" aria-label="Volver al vendedor" style="text-decoration:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      </div>

      <section class="card">
        <div class="section-head" style="margin-top:0"><h2>Filtros</h2></div>
        <div class="form" style="gap:10px">
          <div class="field">
            <label for="filter-fecha">Fecha</label>
            <input id="filter-fecha" type="date">
          </div>
          <div class="field">
            <label for="filter-resultado">Resultado</label>
            <select id="filter-resultado">
              <option value="">Todos</option>
              <option>Venta cerrada</option>
              <option>Venta parcial</option>
              <option>Sin venta</option>
            </select>
          </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px">
          <button class="ghost" id="reset-filters-btn" type="button">Limpiar filtros</button>
          <button class="ghost" id="seed-btn" type="button">Cargar datos demo</button>
          <button class="danger-link" id="clear-btn" type="button">Vaciar demo</button>
        </div>
      </section>

      <section class="metrics" aria-label="Indicadores del equipo">
        <article class="metric-card">
          <p>Vendedores activos</p>
          <strong id="kpi-vendedores">0</strong>
        </article>
        <article class="metric-card">
          <p>Visitas</p>
          <strong id="kpi-visitas">0</strong>
        </article>
        <article class="metric-card">
          <p>Ventas</p>
          <strong id="kpi-ventas">$0</strong>
        </article>
        <article class="metric-card">
          <p>Efectividad</p>
          <strong id="kpi-efectividad">0%</strong>
        </article>
      </section>

      <div class="section-head">
        <h2>Ranking del equipo</h2>
        <p class="sub" id="pendiente-cobro" style="margin:0">Cobranza pendiente: $0</p>
      </div>
      <div id="leaderboard" class="visits-stack"></div>

      <div class="section-head" style="margin-top:22px">
        <h2>Actividad reciente</h2>
      </div>
      <div id="team-visits" class="visits-stack"></div>

      <section id="seller-detail" class="card hidden" style="margin-top:22px">
        <div class="section-head" style="margin-top:0">
          <h2 id="seller-title">Vendedor</h2>
          <button class="link" id="close-seller-btn" type="button">Cerrar</button>
        </div>
        <p class="sub" id="seller-ruta">Ruta</p>
        <div class="metrics" style="margin-top:14px">
          <article class="metric-card"><p>Visitas</p><strong id="seller-visitas">0</strong></article>
          <article class="metric-card"><p>Ventas</p><strong id="seller-ventas">$0</strong></article>
          <article class="metric-card"><p>Efectividad</p><strong id="seller-efectividad">0%</strong></article>
          <article class="metric-card"><p>Pendiente</p><strong id="seller-pendiente">$0</strong></article>
        </div>
        <div id="seller-visits" class="visits-stack"></div>
      </section>
    </main>
  </div>

  <script src="./shared.js"></script>
  <script src="./supervisor.js"></script>
</body>
</html>
