services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitacora_mvp
      POSTGRES_USER: bitacora
      POSTGRES_PASSWORD: bitacora
    ports:
      - "5432:5432"
    volumes:
      - bitacora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitacora -d bitacora_mvp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bitacora_pg:
